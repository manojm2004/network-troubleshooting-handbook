! ==============================================================================
! CISCO CCNA 200-301: MASTER SWITCH CONFIGURATION & COMMAND REFERENCE
! Author: Manoj M (Network & Security Engineer)
! Description: Comprehensive syntax, configuration blocks, and operational
!              commands covering every topic in the Cisco CCNA Switch syllabus.
! ==============================================================================

! ------------------------------------------------------------------------------
! 1. INITIAL SYSTEM SETUP & ADMINISTRATIVE ACCESS
! ------------------------------------------------------------------------------
enable
configure terminal

! Set Switch Identification
hostname Core-Switch-01

! Prevent DNS Lookup freezes on CLI command typos
no ip domain-lookup

! Administrative Security & Remote SSH Access
ip domain-name enterprise.local
crypto key generate rsa modulus 2048
ip ssh version 2
username admin privilege 15 secret Switch@AdminPass123!
enable secret SuperSecretSwitchEnable!
service password-encryption

! Legal Security Banner
banner motd ^C
*******************************************************************************
* AUTHORIZED PERSONNEL ONLY. ALL SESSIONS MONITORED AND LOGGED.               *
*******************************************************************************
^C

! Console Port
line console 0
 exec-timeout 10 0
 logging synchronous
 login local
 exit

! VTY Lines for Secure Management
line vty 0 15
 exec-timeout 15 0
 logging synchronous
 login local
 transport input ssh
 exit

! ------------------------------------------------------------------------------
! 2. SWITCH MANAGEMENT (SVI) & DEFAULT GATEWAY (LAYER 2 SWITCH)
! ------------------------------------------------------------------------------
! Switch Virtual Interface (SVI) for Out-of-Band / In-Band IP Management
interface Vlan 99
 description MANAGEMENT_SVI_INTERFACE
 ip address 10.10.99.10 255.255.255.0
 no shutdown
 exit

! Default Gateway for Layer 2 Switch (Allows remote subnet management)
ip default-gateway 10.10.99.1

! ------------------------------------------------------------------------------
! 3. VLAN CONFIGURATION & ACCESS PORT PROVISIONING
! ------------------------------------------------------------------------------
! Create and Name VLANs in Database
vlan 10
 name ENGINEERING
 exit

vlan 20
 name FINANCE
 exit

vlan 30
 name HR_OPERATIONS
 exit

vlan 150
 name VOICE_IP_PHONES
 exit

vlan 99
 name MANAGEMENT_NATIVE
 exit

! Provision Access Ports for End-User Workstations & IP Phones
interface range FastEthernet0/1 - 10
 description END_USER_DESKTOPS_ENGINEERING
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 150
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
 exit

interface range FastEthernet0/11 - 20
 description END_USER_DESKTOPS_FINANCE
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
 exit

! ------------------------------------------------------------------------------
! 4. TRUNKING CONFIGURATION (802.1Q & DTP)
! ------------------------------------------------------------------------------
! Uplink Trunk to Router or Distribution Switch
interface GigabitEthernet0/1
 description UPLINK_TRUNK_TO_ROUTER
 ! On Catalyst 3560/3750, specify encapsulation first:
 ! switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99,150
 switchport nonegotiate
 no shutdown
 exit

! Dynamic Trunking Protocol (DTP) Modes (Reference only - best practice is nonegotiate)
! switchport mode dynamic desirable  -> Actively attempts to convert link to trunk
! switchport mode dynamic auto       -> Passive, trunks if remote end is desirable/trunk

! ------------------------------------------------------------------------------
! 5. SPANNING TREE PROTOCOL (STP / RSTP / PVST+)
! ------------------------------------------------------------------------------
! Enable Rapid Per-VLAN Spanning Tree (802.1w)
spanning-tree mode rapid-pvst

! Configure Root Bridge Primacy (Decreases Bridge Priority to 24576)
spanning-tree vlan 10,20 root primary

! Configure Secondary Backup Root Bridge (Priority to 28672)
spanning-tree vlan 30,99 root secondary

! Manual Priority Setting (Multiples of 4096: 0, 4096, 8192, ... 32768)
spanning-tree vlan 10 priority 4096

! Global STP Protection Mechanisms
spanning-tree portfast default
spanning-tree portfast bpduguard default

! Interface STP Tuning
interface GigabitEthernet0/2
 spanning-tree cost 4
 spanning-tree vlan 10 port-priority 64
 exit

! ------------------------------------------------------------------------------
! 6. ETHERCHANNEL / LINK AGGREGATION (LACP & PAgP)
! ------------------------------------------------------------------------------
! Option A: Industry Standard LACP (IEEE 802.3ad) - RECOMMENDED
interface range GigabitEthernet0/3 - 4
 description ETHERCHANNEL_BUNDLE_LACP
 switchport mode trunk
 switchport trunk native vlan 99
 channel-group 1 mode active
 no shutdown
 exit

interface Port-channel 1
 description LOGICAL_TRUNK_BUNDLE_1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
 exit

! Global EtherChannel Load-Balancing Hash Algorithm
port-channel load-balance src-dst-ip

! Reference: Mode Keywords
! LACP (802.3ad) : active / passive
! PAgP (Cisco)   : desirable / auto
! Static         : on

! ------------------------------------------------------------------------------
! 7. MULTILAYER (LAYER 3) SWITCHING & INTER-VLAN ROUTING (SVI)
! ------------------------------------------------------------------------------
! Enable Hardware IPv4 / IPv6 Routing Globally
ip routing
ipv6 unicast-routing

! Layer 3 Switch Virtual Interfaces (SVI Default Gateways for LAN)
interface Vlan 10
 description GATEWAY_VLAN_10_ENG
 ip address 10.10.10.1 255.255.255.0
 no shutdown
 exit

interface Vlan 20
 description GATEWAY_VLAN_20_FIN
 ip address 10.10.20.1 255.255.255.0
 no shutdown
 exit

! Convert a Switchport into a Pure Routed Port (No VLAN tag, direct IP)
interface GigabitEthernet0/24
 description ROUTED_P2P_LINK_TO_CORE_ROUTER
 no switchport
 ip address 172.16.1.2 255.255.255.252
 no shutdown
 exit

! ------------------------------------------------------------------------------
! 8. SWITCH SECURITY HARDENING: PORT SECURITY, DHCP SNOOPING, DAI
! ------------------------------------------------------------------------------
! 1. Port Security (Prevents MAC Flooding & Unauthorized Host Connections)
interface range FastEthernet0/1 - 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 ! Violation options:
 ! shutdown -> Disables port into err-disabled state (default)
 ! restrict -> Drops offending frames, increments security violation counter, logs SNMP
 ! protect  -> Silently drops offending frames without logging
 exit

! 2. DHCP Snooping (Prevents Rogue DHCP Servers from hijacking default gateways)
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
no ip dhcp snooping information option

! Trust the Uplink Interface connecting to legitimate DHCP Server/Router
interface GigabitEthernet0/1
 ip dhcp snooping trust
 exit

! Rate-limit untrusted client access ports (prevents DHCP starvation DoS)
interface range FastEthernet0/1 - 24
 ip dhcp snooping limit rate 15
 exit

! 3. Dynamic ARP Inspection (DAI - Prevents ARP Spoofing / Cache Poisoning)
ip arp inspection vlan 10,20,30

interface GigabitEthernet0/1
 ip arp inspection trust
 exit

! 4. Broadcast Storm Control
interface range FastEthernet0/1 - 24
 storm-control broadcast level 10.0
 storm-control action trap
 exit

! ------------------------------------------------------------------------------
! 9. DISCOVERY PROTOCOLS: CDP & LLDP
! ------------------------------------------------------------------------------
cdp run
lldp run

! Disable on external-facing untrusted guest ports for security
interface FastEthernet0/24
 no cdp enable
 no lldp transmit
 no lldp receive
 exit

! ------------------------------------------------------------------------------
! 10. OPERATIONAL VERIFICATION & TROUBLESHOOTING COMMANDS (EXEC MODE)
! ------------------------------------------------------------------------------
! show vlan brief                   -> Verify existing VLANs and access port assignments
! show interfaces status            -> Check port speed, duplex, VLAN, and link status
! show interfaces trunk             -> Check native VLAN, encapsulation, allowed VLANs
! show mac address-table            -> Inspect Layer 2 forwarding table (Dynamic/Static)
! show mac address-table dynamic    -> Display only learned host MAC addresses
! show spanning-tree                -> Check Root Bridge ID, Bridge Priority, Port Roles
! show spanning-tree summary        -> Quick check of PortFast, BPDU Guard, UplinkFast
! show spanning-tree vlan <id>      -> Deep dive into a single VLAN STP topology
! show etherchannel summary         -> Check Port-Channel status (Flags: SU, P = in bundle)
! show port-security                -> Check configured port security policies
! show port-security interface <if> -> Detailed view of sticky MACs & violation count
! show ip dhcp snooping             -> Verify trusted vs untrusted DHCP snooping ports
! show ip dhcp snooping binding     -> Inspect MAC-to-IP-to-VLAN-to-Lease snooping table
! show ip arp inspection            -> Check packets dropped by DAI
! show cdp neighbors detail         -> Identify adjacent switch models, ports & IPs
! show lldp neighbors detail        -> Identify multi-vendor devices (Arista, HP, etc.)
! clear mac address-table dynamic   -> Flush learned MAC addresses from CAM table

! Save changes to NVRAM
! copy running-config startup-config
! ==============================================================================
