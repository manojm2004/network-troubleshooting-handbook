! ==============================================================================
! CISCO CCNA 200-301: MASTER ROUTER CONFIGURATION & COMMAND REFERENCE
! Author: Manoj M (Network & Security Engineer)
! Description: Comprehensive syntax, configuration blocks, and operational
!              commands covering every topic in the Cisco CCNA Router syllabus.
! ==============================================================================

! ------------------------------------------------------------------------------
! 1. INITIAL SYSTEM SETUP & ADMINISTRATIVE ACCESS
! ------------------------------------------------------------------------------
enable
configure terminal

! Set Device Identification
hostname Branch-Router-01

! Disable Unwanted DNS Name Resolution (Prevents freeze on typo)
no ip domain-lookup

! Domain Name & RSA Key for Secure Shell (SSHv2)
ip domain-name enterprise.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! Strong Administrative User Credentials
username admin privilege 15 secret Cisco@AdminPass123!
enable secret SuperSecretEnablePass!

! Encrypt all clear-text passwords in configuration
service password-encryption

! Legal Security Banner
banner motd ^C
*******************************************************************************
* WARNING: UNAUTHORIZED ACCESS TO THIS CISCO ROUTER IS STRICTLY PROHIBITED.   *
* ALL SESSIONS ARE MONITORED, LOGGED, AND PROSECUTED UNDER CYBER SECURITY LAW *
*******************************************************************************
^C

! Console Port Configuration
line console 0
 exec-timeout 10 0
 logging synchronous
 login local
 history size 50
 exit

! Virtual Terminal (VTY) Configuration for Remote SSH Access
line vty 0 4
 exec-timeout 15 0
 logging synchronous
 login local
 transport input ssh
 transport output none
 exit

line vty 5 15
 exec-timeout 15 0
 login local
 transport input ssh
 exit

! ------------------------------------------------------------------------------
! 2. INTERFACE CONFIGURATION & INTER-VLAN ROUTING (ROUTER-ON-A-STICK)
! ------------------------------------------------------------------------------
! Physical WAN Interface
interface GigabitEthernet0/0/0
 description WAN_UPLINK_TO_ISP1
 ip address 203.0.113.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
 exit

! Physical LAN Trunk Interface (Parent Interface)
interface GigabitEthernet0/0/1
 description TRUNK_UPLINK_TO_CORE_SWITCH
 no ip address
 no shutdown
 exit

! Subinterface for VLAN 10 (Engineering / IT)
interface GigabitEthernet0/0/1.10
 description GATEWAY_FOR_VLAN_10_ENGINEERING
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 no shutdown
 exit

! Subinterface for VLAN 20 (Finance / Operations)
interface GigabitEthernet0/0/1.20
 description GATEWAY_FOR_VLAN_20_FINANCE
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 no shutdown
 exit

! Subinterface for VLAN 30 (Guest WiFi)
interface GigabitEthernet0/0/1.30
 description GATEWAY_FOR_VLAN_30_GUEST
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 no shutdown
 exit

! Subinterface for VLAN 99 (Native VLAN & Network Management)
interface GigabitEthernet0/0/1.99
 description GATEWAY_FOR_VLAN_99_MANAGEMENT
 encapsulation dot1Q 99 native
 ip address 10.10.99.1 255.255.255.0
 no shutdown
 exit

! Loopback Interface for Router-ID and Monitoring
interface Loopback0
 description ROUTER_ID_LOGICAL_INTERFACE
 ip address 1.1.1.1 255.255.255.255
 exit

! ------------------------------------------------------------------------------
! 3. IP ROUTING: STATIC & DEFAULT ROUTING (IPv4 & IPv6)
! ------------------------------------------------------------------------------
! Enable IPv6 Routing Globally
ipv6 unicast-routing

! IPv4 Default Route (Quad-Zero Gateway of Last Resort)
ip route 0.0.0.0 0.0.0.0 203.0.113.1

! IPv4 Floating Static Route (Backup path with Administrative Distance = 200)
ip route 0.0.0.0 0.0.0.0 198.51.100.1 200

! Specific IPv4 Static Route to Partner Remote Subnet
ip route 172.16.50.0 255.255.255.0 203.0.113.1

! IPv6 Default Route
ipv6 route ::/0 2001:DB8:WAN::1

! ------------------------------------------------------------------------------
! 4. DYNAMIC ROUTING: OSPFv2 (OPEN SHORTEST PATH FIRST)
! ------------------------------------------------------------------------------
router ospf 1
 ! Explicitly assign unique 32-bit Router-ID
 router-id 1.1.1.1
 
 ! Tune reference bandwidth for modern Gigabit/10G interfaces (in Mbps)
 auto-cost reference-bandwidth 1000
 
 ! Suppress OSPF Hello packets on end-user LAN subinterfaces
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 no passive-interface Loopback0
 
 ! Advertise connected subnets using Wildcard Masks into Backbone Area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 network 1.1.1.1 0.0.0.0 area 0
 
 ! Propagate Default Route to all internal OSPF neighbors
 default-information originate
 exit

! Interface-level OSPF Tuning
interface GigabitEthernet0/0/0
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf dead-interval 20
 ip ospf priority 255
 exit

! ------------------------------------------------------------------------------
! 5. IP SERVICES: DHCP SERVER & DHCP RELAY
! ------------------------------------------------------------------------------
! Exclude Static Infrastructure IPs (Gateways, Printers, Servers)
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20

! DHCP Pool for Engineering (VLAN 10)
ip dhcp pool POOL_VLAN_10_ENG
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 8.8.8.8 1.1.1.1
 domain-name enterprise.local
 lease 7 0 0
 exit

! DHCP Pool for Finance (VLAN 20)
ip dhcp pool POOL_VLAN_20_FIN
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 8.8.8.8
 domain-name enterprise.local
 lease 3 12 0
 exit

! DHCP Relay Agent (If DHCP server is centralized on another subnet)
! interface GigabitEthernet0/0/1.30
!  ip helper-address 10.10.10.100
! exit

! ------------------------------------------------------------------------------
! 6. NETWORK ADDRESS TRANSLATION (NAT & PAT / NAT OVERLOAD)
! ------------------------------------------------------------------------------
! Define NAT Interfaces
interface GigabitEthernet0/0/0
 ip nat outside
 exit

interface GigabitEthernet0/0/1.10
 ip nat inside
 exit

interface GigabitEthernet0/0/1.20
 ip nat inside
 exit

! Standard ACL identifying private IP ranges permitted to be translated
ip access-list standard ACL_NAT_PERMITTED
 permit 10.10.10.0 0.0.0.255
 permit 10.10.20.0 0.0.0.255
 deny any
 exit

! Port Address Translation (PAT / NAT Overload) using Public WAN Interface
ip nat inside source list ACL_NAT_PERMITTED interface GigabitEthernet0/0/0 overload

! Static NAT (1-to-1 mapping for Internal Web Server to Public IP)
ip nat inside source static 10.10.10.50 203.0.113.10

! ------------------------------------------------------------------------------
! 7. ACCESS CONTROL LISTS (STANDARD & EXTENDED)
! ------------------------------------------------------------------------------
! Standard Named ACL: Permit only IT Admin subnets to SSH to router
ip access-list standard ACL_ADMIN_MGMT
 permit 10.10.99.0 0.0.0.255
 permit host 10.10.10.5
 deny any log
 exit

line vty 0 4
 access-class ACL_ADMIN_MGMT in
 exit

! Extended Named ACL: Enforce Departmental Traffic Boundaries
ip access-list extended ACL_FILTER_INTERNAL
 ! Permit established TCP return traffic
 permit tcp any any established
 ! Allow Engineering to access Finance Web Server on HTTP/HTTPS only
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.50 eq 80
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.50 eq 443
 ! Deny Engineering access to all other Finance assets
 deny ip 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 log
 ! Permit DNS to public internet
 permit udp any host 8.8.8.8 eq 53
 permit udp any host 1.1.1.1 eq 53
 ! Permit ICMP Echo (Ping) for troubleshooting
 permit icmp any any echo
 permit icmp any any echo-reply
 ! Permit all other outbound internet traffic
 permit ip 10.10.10.0 0.0.0.255 any
 deny ip any any log
 exit

! Apply Extended ACL to inbound interface
interface GigabitEthernet0/0/1.10
 ip access-group ACL_FILTER_INTERNAL in
 exit

! ------------------------------------------------------------------------------
! 8. FIRST HOP REDUNDANCY PROTOCOL: HSRP (HOT STANDBY ROUTER PROTOCOL)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/0/1.10
 standby version 2
 standby 10 ip 10.10.10.254
 standby 10 priority 110
 standby 10 preempt
 standby 10 authentication md5 key-string HSRPSecretKey10
 standby 10 track GigabitEthernet0/0/0 20
 exit

! ------------------------------------------------------------------------------
! 9. NETWORK MANAGEMENT & MONITORING: NTP, SYSLOG, SNMP, CDP/LLDP
! ------------------------------------------------------------------------------
! Clock & Network Time Protocol (NTP)
clock timezone IST 5 30
ntp server 216.239.35.0 prefer
ntp update-calendar

! Centralized Syslog Logging
logging buffered 64000 informational
logging trap warnings
logging source-interface Loopback0
logging host 10.10.99.50

! Simple Network Management Protocol (SNMP)
snmp-server community PublicReadOnly RO
snmp-server community AdminPrivateRW RW
snmp-server location "DataCenter-Rack-04, Bangalore"
snmp-server contact "Manoj M (manojmmanu@gmail.com)"
snmp-server enable traps

! Discovery Protocols
cdp run
lldp run

! ------------------------------------------------------------------------------
! 10. OPERATIONAL VERIFICATION & TROUBLESHOOTING COMMANDS (EXEC MODE)
! ------------------------------------------------------------------------------
! show version                      -> Hardware, IOS image filename, license & uptime
! show running-config               -> Display active RAM configuration
! show ip interface brief           -> Quick status of all IPv4 interfaces (Up/Down)
! show ip route                     -> Inspect active IPv4 routing table
! show ip route ospf                -> Display only OSPF learned routes
! show ip ospf neighbor             -> Verify OSPF neighbor adjacency & states (FULL)
! show ip ospf database             -> Inspect OSPF Link-State Database (LSDB)
! show ip ospf interface            -> Verify DR/BDR, Hello/Dead timers, cost
! show ip nat translations          -> View active inside/outside NAT & PAT sessions
! show ip nat statistics            -> Track total translations, hits, misses, pools
! show ip dhcp binding              -> View active IPv4 leases handed out to clients
! show ip dhcp pool                 -> Verify address utilization percentage
! show access-lists                 -> Verify ACL rule hit counters and matches
! show standby brief                -> Verify HSRP state (Active / Standby / Speak)
! show ntp status                   -> Check clock synchronization & stratum level
! show cdp neighbors detail         -> Identify adjacent Cisco device models & IP
! ping <dest_ip> repeat 50 size 1400-> Test latency & packet loss
! traceroute <dest_ip>              -> Pinpoint exact hop where traffic fails
! debug ip packet                   -> Live packet capture on router (Use with caution)
! debug ip ospf events              -> Troubleshoot neighbor negotiation failures
! undebug all                       -> Instantly kill all running debug processes

! Save changes to NVRAM
! copy running-config startup-config
! ==============================================================================
